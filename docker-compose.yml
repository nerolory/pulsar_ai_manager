services:

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      RELOAD: "true"         # uvicorn перезапускается при изменении .py файлов
      NO_PROXY: "*"
      no_proxy: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "18080:8000"
    volumes:
      - ./backend:/app       # вся папка backend ↔ /app в контейнере
      - backend_data:/app/data  # персистентное хранилище настроек
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app                    # вся папка frontend ↔ /app
      - frontend_node_modules:/app/node_modules  # node_modules живёт только в контейнере
    environment:
      VITE_BACKEND_PROXY: "http://backend:8000"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "18081:80"
    depends_on:
      - backend
    profiles: [prod]

volumes:
  frontend_node_modules:
  backend_data:
