<!DOCTYPE html>
<html>
<head>
    <title>API URL Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .pending { background: #fff3cd; }
    </style>
</head>
<body>
    <h1>API URL Debug Tool</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');
        
        // Environment variables
        const env = {
            VITE_API_URL: import.meta.env.VITE_API_URL,
            VITE_BACKEND_PROXY: import.meta.env.VITE_BACKEND_PROXY
        };
        
        function log(message, type = 'pending') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        async function testUrl(url, description) {
            const fullUrl = url.startsWith('http') ? url : `${window.location.origin}${url}`;
            log(`Testing: ${description} - ${fullUrl}`, 'pending');
            try {
                const response = await fetch(url);
                const responseText = await response.text();
                if (response.ok) {
                    log(`✅ SUCCESS: ${description} - Status: ${response.status} - Response: ${responseText} - ${fullUrl}`, 'success');
                    return true;
                } else {
                    log(`❌ ERROR: ${description} - Status: ${response.status} - Response: ${responseText} - ${fullUrl}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ ERROR: ${description} - ${error.message} - ${fullUrl}`, 'error');
                return false;
            }
        }
        
        async function runTests() {
            log('=== Environment Variables ===');
            log(`VITE_API_URL: ${env.VITE_API_URL}`);
            log(`VITE_BACKEND_PROXY: ${env.VITE_BACKEND_PROXY}`);
            
            log('\n=== URL Tests ===');
            
            // Test different URL patterns
            await testUrl('/api/v1/settings/health', 'Relative /api/v1/settings/health');
            await testUrl('/api/settings/health', 'Relative /api/settings/health');
            await testUrl('/api/v1/chats', 'Relative /api/v1/chats');
            await testUrl('/api/chats', 'Relative /api/chats');
            
            // Test if backend is accessible directly
            await testUrl('http://backend:8000/api/v1/settings/health', 'Direct backend:8000/api/v1/settings/health');
            await testUrl('http://localhost:8000/api/v1/settings/health', 'Direct localhost:8000/api/v1/settings/health');
            
            log('\n=== Chat API Test ===');
            await testUrl('/api/v1/chat/stream', 'Chat stream endpoint (should fail without POST)');
        }
        
        runTests();
    </script>
</body>
</html>
