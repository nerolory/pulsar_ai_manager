<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulsarAI — Редактор изображений</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg-panel: #12121c;
    --bg-s: rgba(255,255,255,0.04);
    --bg-h: rgba(255,255,255,0.08);
    --brd: rgba(255,255,255,0.09);
    --accent: #6366F1;
    --accent-l: #818CF8;
    --t1: #F1F1F5;
    --t2: #8B8BA7;
    --t3: #4A4A62;
    --r: 10px;
    --rs: 7px;
    --toolbar-h: 52px;
    --bottom-h: 56px;
  }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--t1);
    user-select: none;
  }

  /* ── LAYOUT ── */
  .editor {
    display: flex; flex-direction: column; height: 100vh;
  }

  /* ── TOP TOOLBAR ── */
  .toolbar {
    flex-shrink: 0;
    background: var(--bg-panel); border-bottom: 1px solid var(--brd);
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 4px 8px;
    position: relative; z-index: 10; min-height: var(--toolbar-h);
  }

  .tb-logo { display: flex; align-items: center; gap: 8px; margin-right: 6px; flex-shrink: 0; }
  .tb-logo-icon { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; }
  .tb-logo-txt { font-size: 13px; font-weight: 700; }
  .tb-logo-txt em { font-style: normal; color: var(--accent-l); }

  .tb-sep { width: 1px; height: 24px; background: var(--brd); margin: 0 3px; flex-shrink: 0; }

  /* Tool groups */
  .tool-group { display: flex; align-items: center; gap: 1px; flex-wrap: nowrap; }
  .tool-group-label { font-size: 9px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 3px 0 1px; white-space: nowrap; }

  .tbtn {
    width: 30px; height: 30px; border-radius: var(--rs); border: none;
    background: none; color: var(--t2); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all .14s; position: relative;
  }
  .tbtn:hover { background: var(--bg-h); color: var(--t1); }
  .tbtn.on { background: rgba(99,102,241,0.2); color: var(--accent-l); box-shadow: 0 0 0 1px rgba(99,102,241,0.4); }
  .tbtn[title]:hover::after {
    content: attr(title); position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
    background: #1e1e2f; border: 1px solid var(--brd); border-radius: 5px;
    padding: 3px 8px; font-size: 11px; color: var(--t1); white-space: nowrap; z-index: 100; pointer-events: none;
  }

  /* Color picker inline */
  .color-btn {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--brd); cursor: pointer;
    flex-shrink: 0; transition: border-color .14s; overflow: hidden; position: relative;
  }
  .color-btn:hover { border-color: var(--accent-l); }
  .color-btn input[type=color] { position: absolute; inset: -4px; width: 140%; height: 140%; opacity: 0; cursor: pointer; }

  .size-select {
    background: var(--bg-s); border: 1px solid var(--brd); border-radius: var(--rs);
    color: var(--t1); font-size: 11px; padding: 3px 4px; outline: none; cursor: pointer;
    height: 26px; max-width: 68px;
  }
  .size-select:focus { border-color: rgba(99,102,241,0.4); }

  .font-select {
    background: var(--bg-s); border: 1px solid var(--brd); border-radius: var(--rs);
    color: var(--t1); font-size: 11px; padding: 3px 4px; outline: none; cursor: pointer;
    height: 26px; max-width: 110px; min-width: 80px;
  }

  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; order: -1; }
  .tb-tools-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; flex: 1; order: 0; min-width: 0; }
  .btn { padding: 6px 11px; border-radius: var(--rs); font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; border: none; white-space: nowrap; }
  .btn-secondary { background: var(--bg-s); border: 1px solid var(--brd); color: var(--t2); }
  .btn-secondary:hover { color: var(--t1); border-color: rgba(99,102,241,0.4); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #8B5CF6); color: #fff; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
  .btn-primary:hover { box-shadow: 0 4px 16px rgba(99,102,241,0.5); transform: translateY(-1px); }
  .btn-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #F87171; }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }

  /* ── CANVAS AREA ── */
  .canvas-wrap {
    flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center;
    position: relative;
    background:
      radial-gradient(ellipse 50% 40% at 20% 30%, rgba(99,102,241,0.06) 0%, transparent 60%),
      var(--bg);
  }

  /* checkerboard bg for transparent areas */
  .canvas-wrap::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }

  .canvas-container {
    position: relative; z-index: 1;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
    border-radius: 4px; overflow: hidden;
    cursor: crosshair;
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - var(--toolbar-h) - var(--bottom-h) - 40px);
  }

  #base-canvas { display: block; position: relative; z-index: 1; }
  #draw-canvas {
    position: absolute; top: 0; left: 0; z-index: 2;
    pointer-events: all;
    outline: none;
  }

  /* crop overlay */
  .crop-overlay {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: rgba(0,0,0,0.55);
    display: none;
  }
  .crop-overlay.active { display: block; pointer-events: all; cursor: crosshair; }
  .crop-region {
    position: absolute; border: 2px solid #fff;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    cursor: move;
  }
  .crop-handle {
    position: absolute; width: 10px; height: 10px;
    background: #fff; border: 1px solid rgba(0,0,0,0.3);
  }
  .crop-handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
  .crop-handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
  .crop-handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
  .crop-handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    height: var(--bottom-h); flex-shrink: 0;
    background: var(--bg-panel); border-top: 1px solid var(--brd);
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    font-size: 12px; color: var(--t3);
  }
  .bb-stat { display: flex; gap: 4px; align-items: center; }
  .bb-stat b { color: var(--t2); font-weight: 500; }
  .bb-zoom { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .zoom-btn { width: 24px; height: 24px; border-radius: 6px; background: var(--bg-s); border: 1px solid var(--brd); color: var(--t2); font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .14s; }
  .zoom-btn:hover { background: var(--bg-h); color: var(--t1); }
  .zoom-val { font-size: 12px; color: var(--t2); min-width: 38px; text-align: center; }

  /* hidden textarea for text tool input */
  #text-input-hidden {
    position: fixed; opacity: 0; pointer-events: none;
    top: 0; left: 0; width: 1px; height: 1px;
    border: none; outline: none; resize: none; overflow: hidden;
    font-size: 16px;
  }

  /* undo/redo count badge */
  .history-badge {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--t3); padding: 0 6px;
  }

  /* no image placeholder */
  .no-image {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    color: var(--t3); position: absolute; text-align: center;
  }
  .no-image-icon { font-size: 52px; opacity: .3; }
  .no-image-text { font-size: 14px; }
  .no-image-hint { font-size: 12px; color: var(--t3); opacity: .7; }
  .no-image-btn {
    padding: 10px 20px; border-radius: var(--r); background: var(--accent-dim, rgba(99,102,241,0.15));
    border: 1px solid rgba(99,102,241,0.4); color: var(--accent-l); font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .no-image-btn:hover { background: rgba(99,102,241,0.25); }

  /* palette dots */
  .palette-dot {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15); transition: all .12s; position: relative;
  }
  .palette-dot:hover { transform: scale(1.25); border-color: rgba(255,255,255,0.5); }
  .palette-dot.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }

  /* blur size selector */
  .blur-size-wrap { display:flex; align-items:center; gap:2px; font-size:10px; color:var(--t3); white-space:nowrap; }

  /* active tool indicator */
  .tool-indicator {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); border: 1px solid var(--brd);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--t2);
    pointer-events: none; z-index: 30; white-space: nowrap;
    transition: opacity .2s;
  }
  .tool-indicator.hidden { opacity: 0; }
</style>
</head>
<body>
<div class="editor">

  <!-- ── TOP TOOLBAR ── -->
  <div class="toolbar">
    <div class="tb-logo">
      <div class="tb-logo-icon">P</div>
      <div class="tb-logo-txt">Pulsar<em>AI</em> · Редактор</div>
    </div>
    <!-- Right: actions (order:-1 keeps on first row) -->
    <div class="tb-right">
      <button class="btn btn-danger" onclick="clearDrawings()" title="Удалить все аннотации">Очистить</button>
      <button class="btn btn-secondary" onclick="cancelEditor()">Отмена</button>
      <button class="btn btn-primary" onclick="applyAndClose()">✓ Применить</button>
    </div>

    <!-- All tool groups wrap freely -->
    <div class="tb-tools-wrap">

      <!-- Transform tools -->
      <div class="tool-group">
        <span class="tool-group-label">Правка</span>
        <button class="tbtn" id="btn-select" title="Выбор / Перемещение" onclick="setTool('select')">☰</button>
        <button class="tbtn" id="btn-crop" title="Обрезать изображение" onclick="setTool('crop')">⬚</button>
        <button class="tbtn" id="btn-rotate-l" title="Повернуть влево 90°" onclick="rotateImage(-90)">↺</button>
        <button class="tbtn" id="btn-rotate-r" title="Повернуть вправо 90°" onclick="rotateImage(90)">↻</button>
        <button class="tbtn" id="btn-flip-h" title="Отразить горизонтально" onclick="flipImage('h')">⇔</button>
        <button class="tbtn" id="btn-flip-v" title="Отразить вертикально" onclick="flipImage('v')">⇕</button>
      </div>

      <div class="tb-sep"></div>

      <!-- Drawing tools -->
      <div class="tool-group">
        <span class="tool-group-label">Рисование</span>
        <button class="tbtn" id="btn-arrow" title="Стрелка (любой угол и длина)" onclick="setTool('arrow')">↗</button>
        <button class="tbtn" id="btn-rect" title="Прямоугольная рамка" onclick="setTool('rect')">▭</button>
        <button class="tbtn" id="btn-circle" title="Круглая рамка" onclick="setTool('circle')">◯</button>
        <button class="tbtn" id="btn-pen" title="Свободное рисование" onclick="setTool('pen')">✏</button>
        <button class="tbtn" id="btn-text" title="Добавить текст" onclick="setTool('text')">T</button>
        <button class="tbtn" id="btn-eraser" title="Ластик (удалить объект)" onclick="setTool('eraser')">◻</button>
        <button class="tbtn" id="btn-blur" title="Замазка — скрыть личные данные, пикселизировать область" onclick="setTool('blur')" style="font-size:13px;font-weight:700">🔲</button>
        <div class="blur-size-wrap">
          <span>мозаика</span>
          <select class="size-select" id="blur-block-size" title="Размер блока пикселизации">
            <option value="8">8px</option>
            <option value="12">12px</option>
            <option value="16" selected>16px</option>
            <option value="24">24px</option>
            <option value="32">32px</option>
          </select>
        </div>
      </div>

      <div class="tb-sep"></div>

      <!-- Style options -->
      <div class="tool-group">
        <span class="tool-group-label">Стиль</span>
        <div class="color-btn" id="stroke-color-btn" style="background:#EF4444" title="Цвет линии">
          <input type="color" id="stroke-color" value="#EF4444" oninput="updateStrokeColor(this.value)">
        </div>
        <div class="color-btn" id="fill-color-btn" style="background:rgba(99,102,241,0.3);border-color:rgba(99,102,241,0.5)" title="Цвет заливки (для рамок)">
          <input type="color" id="fill-color" value="#6366F1" oninput="updateFillColor(this.value)">
        </div>
        <div style="display:flex;gap:3px;align-items:center;margin-left:2px;flex-wrap:nowrap" title="Быстрая палитра">
          <div class="palette-dot" style="background:#EF4444" onclick="setStrokePreset('#EF4444')" title="Красный"></div>
          <div class="palette-dot" style="background:#F97316" onclick="setStrokePreset('#F97316')" title="Оранжевый"></div>
          <div class="palette-dot" style="background:#EAB308" onclick="setStrokePreset('#EAB308')" title="Жёлтый"></div>
          <div class="palette-dot" style="background:#22C55E" onclick="setStrokePreset('#22C55E')" title="Зелёный"></div>
          <div class="palette-dot" style="background:#3B82F6" onclick="setStrokePreset('#3B82F6')" title="Синий"></div>
          <div class="palette-dot" style="background:#A855F7" onclick="setStrokePreset('#A855F7')" title="Фиолетовый"></div>
          <div class="palette-dot" style="background:#FFFFFF;border-color:rgba(255,255,255,0.3)" onclick="setStrokePreset('#FFFFFF')" title="Белый"></div>
          <div class="palette-dot" style="background:#000000" onclick="setStrokePreset('#000000')" title="Чёрный"></div>
        </div>
        <select class="size-select" id="line-width" onchange="updateLineWidth(this.value)" title="Толщина линии">
          <option value="1">1px</option>
          <option value="2" selected>2px</option>
          <option value="3">3px</option>
          <option value="4">4px</option>
          <option value="6">6px</option>
          <option value="8">8px</option>
        </select>
        <select class="font-select" id="font-family" title="Шрифт текста">
          <option value="Inter, sans-serif" selected>Inter</option>
          <option value="'Courier New', monospace">Courier</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="Impact, sans-serif">Impact</option>
        </select>
        <select class="size-select" id="font-size" title="Размер шрифта">
          <option value="14">14px</option>
          <option value="18" selected>18px</option>
          <option value="22">22px</option>
          <option value="28">28px</option>
          <option value="36">36px</option>
          <option value="48">48px</option>
        </select>
      </div>

      <div class="tb-sep"></div>

      <!-- History -->
      <div class="tool-group">
        <button class="tbtn" id="btn-undo" title="Отменить (Ctrl+Z)" onclick="undo()">⟵</button>
        <button class="tbtn" id="btn-redo" title="Повторить (Ctrl+Y)" onclick="redo()">⟶</button>
        <div class="history-badge" id="history-badge">0 действий</div>
      </div>

    </div>
  </div>

  <!-- ── CANVAS AREA ── -->
  <div class="canvas-wrap" id="canvas-wrap">

    <!-- No image placeholder -->
    <div class="no-image" id="no-image-placeholder">
      <div class="no-image-icon">🖼</div>
      <div class="no-image-text">Нет изображения</div>
      <div class="no-image-hint">Вставьте скриншот через Ctrl+V или загрузите файл</div>
      <label class="no-image-btn">
        📂 Открыть изображение
        <input type="file" accept="image/*" style="display:none" onchange="loadImageFile(this)">
      </label>
    </div>

    <!-- Canvas container (hidden until image loaded) -->
    <div class="canvas-container" id="canvas-container" style="display:none">
      <canvas id="base-canvas"></canvas>
      <canvas id="draw-canvas" tabindex="-1"></canvas>
      <div class="crop-overlay" id="crop-overlay">
        <div class="crop-region" id="crop-region">
          <div class="crop-handle tl" data-handle="tl"></div>
          <div class="crop-handle tr" data-handle="tr"></div>
          <div class="crop-handle bl" data-handle="bl"></div>
          <div class="crop-handle br" data-handle="br"></div>
        </div>
      </div>
    </div>

    <!-- Active tool indicator -->
    <div class="tool-indicator hidden" id="tool-indicator"></div>
  </div>

  <!-- ── BOTTOM BAR ── -->
  <div class="bottom-bar">
    <div class="bb-stat"><span>Размер:</span><b id="stat-size">—</b></div>
    <div class="bb-stat"><span>Инструмент:</span><b id="stat-tool">Выбор</b></div>
    <div class="bb-stat"><span>Объектов:</span><b id="stat-objects">0</b></div>
    <div class="bb-stat" id="stat-pos-wrap" style="display:none"><span>Курсор:</span><b id="stat-pos">0, 0</b></div>
    <div class="bb-zoom">
      <div class="zoom-btn" onclick="changeZoom(-0.1)">−</div>
      <div class="zoom-val" id="zoom-val">100%</div>
      <div class="zoom-btn" onclick="changeZoom(0.1)">+</div>
      <div class="zoom-btn" onclick="resetZoom()" title="Сбросить масштаб" style="width:auto;padding:0 8px;font-size:11px">Fit</div>
    </div>
  </div>

</div>

<!-- Hidden textarea for text input -->
<textarea id="text-input-hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
const state = {
  tool: 'select',
  strokeColor: '#EF4444',
  fillColor: 'transparent',
  lineWidth: 2,
  fontFamily: 'Inter, sans-serif',
  fontSize: 18,
  zoom: 1,
  objects: [],        // annotation objects
  undoStack: [],
  redoStack: [],
  drawing: false,
  currentObj: null,
  imgW: 0, imgH: 0,
  // crop state
  crop: { active: false, x: 0, y: 0, w: 0, h: 0, dragging: false, handle: null, startX: 0, startY: 0, origCrop: null },
  textPos: null,
  textEditing: false,
};

const baseCanvas = document.getElementById('base-canvas');
const drawCanvas = document.getElementById('draw-canvas');
const bCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
const dCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
let baseImage = null;  // ImageData of original image

// ── Init ──────────────────────────────────────────
function initCanvases(w, h) {
  state.imgW = w; state.imgH = h;
  baseCanvas.width = w; baseCanvas.height = h;
  drawCanvas.width = w; drawCanvas.height = h;
  baseCanvas.style.width = w + 'px'; baseCanvas.style.height = h + 'px';
  drawCanvas.style.width = w + 'px'; drawCanvas.style.height = h + 'px';
  document.getElementById('stat-size').textContent = w + ' × ' + h + ' px';
  document.getElementById('canvas-container').style.display = 'block';
  document.getElementById('no-image-placeholder').style.display = 'none';
  applyZoom();
}

function loadImageFromDataUrl(dataUrl) {
  const img = new Image();
  img.onload = () => {
    initCanvases(img.width, img.height);
    bCtx.drawImage(img, 0, 0);
    baseImage = bCtx.getImageData(0, 0, img.width, img.height);
    saveUndo();
  };
  img.src = dataUrl;
}

function loadImageFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => loadImageFromDataUrl(e.target.result);
  reader.readAsDataURL(file);
}

// Paste listener
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ev => loadImageFromDataUrl(ev.target.result);
      reader.readAsDataURL(blob);
      break;
    }
  }
});

// ── Tool selection ─────────────────────────────────
function setTool(tool) {
  state.tool = tool;
  // update buttons
  document.querySelectorAll('.tbtn[id^="btn-"]').forEach(b => b.classList.remove('on'));
  const btn = document.getElementById('btn-' + tool);
  if (btn) btn.classList.add('on');
  document.getElementById('stat-tool').textContent = {
    select: 'Выбор', crop: 'Обрезка', arrow: 'Стрелка', rect: 'Рамка',
    circle: 'Эллипс', pen: 'Карандаш', text: 'Текст', eraser: 'Ластик', blur: 'Замазка'
  }[tool] || tool;
  // cursor
  drawCanvas.style.cursor = {
    select: 'default', crop: 'crosshair', arrow: 'crosshair',
    rect: 'crosshair', circle: 'crosshair', pen: 'crosshair',
    text: 'text', eraser: 'cell', blur: 'crosshair'
  }[tool] || 'crosshair';
  // crop overlay
  if (tool !== 'crop') {
    document.getElementById('crop-overlay').classList.remove('active');
    state.crop.active = false;
  }
  showToolIndicator(tool);
}

function showToolIndicator(tool) {
  const labels = { arrow:'Стрелка — тяни для направления', rect:'Рамка — тяни для размера', circle:'Эллипс — тяни для размера', pen:'Карандаш — рисуй свободно', text:'Текст — кликни для ввода', eraser:'Ластик — кликни объект', crop:'Обрезка — выдели область', select:'Выбор', blur:'Замазка — выдели область с ПД для пикселизации' };
  const el = document.getElementById('tool-indicator');
  el.textContent = labels[tool] || '';
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 2500);
}

// ── Style updates ──────────────────────────────────
function updateStrokeColor(v) {
  state.strokeColor = v;
  document.getElementById('stroke-color-btn').style.background = v;
}
function updateFillColor(v) {
  state.fillColor = v;
  document.getElementById('fill-color-btn').style.background = v;
}
function updateLineWidth(v) { state.lineWidth = parseInt(v); }

function setStrokePreset(color) {
  state.strokeColor = color;
  document.getElementById('stroke-color-btn').style.background = color;
  document.getElementById('stroke-color').value = color;
  // update active dot
  document.querySelectorAll('.palette-dot').forEach(d => d.classList.remove('on'));
  event.currentTarget.classList.add('on');
}

// ── Undo / Redo ────────────────────────────────────
function saveUndo() {
  const snap = {
    objects: JSON.parse(JSON.stringify(state.objects)),
    baseImageData: bCtx.getImageData(0, 0, state.imgW, state.imgH)
  };
  state.undoStack.push(snap);
  state.redoStack = [];
  if (state.undoStack.length > 50) state.undoStack.shift();
  updateHistoryBadge();
}

function undo() {
  if (state.undoStack.length < 2) return;
  state.redoStack.push(state.undoStack.pop());
  const snap = state.undoStack[state.undoStack.length - 1];
  state.objects = JSON.parse(JSON.stringify(snap.objects));
  bCtx.putImageData(snap.baseImageData, 0, 0);
  renderDrawings();
  updateHistoryBadge();
}

function redo() {
  if (!state.redoStack.length) return;
  const snap = state.redoStack.pop();
  state.undoStack.push(snap);
  state.objects = JSON.parse(JSON.stringify(snap.objects));
  bCtx.putImageData(snap.baseImageData, 0, 0);
  renderDrawings();
  updateHistoryBadge();
}

function updateHistoryBadge() {
  const n = state.objects.length;
  document.getElementById('history-badge').textContent = n + ' ' + (n===1?'объект':n<5?'объекта':'объектов');
  document.getElementById('stat-objects').textContent = n;
}

function clearDrawings() {
  state.objects = [];
  dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  saveUndo();
}

// ── Rendering ──────────────────────────────────────
function renderDrawings() {
  dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  for (const obj of state.objects) renderObject(obj, false);
}

function renderObject(obj, isPreview) {
  const ctx = dCtx;
  ctx.save();
  ctx.strokeStyle = obj.strokeColor || '#EF4444';
  ctx.fillStyle = obj.fillColor || 'transparent';
  ctx.lineWidth = obj.lineWidth || 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (obj.type === 'arrow') {
    drawArrow(ctx, obj.x1, obj.y1, obj.x2, obj.y2, obj.lineWidth);
  } else if (obj.type === 'rect') {
    if (obj.fillColor && obj.fillColor !== 'transparent') { ctx.fillRect(obj.x, obj.y, obj.w, obj.h); }
    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
  } else if (obj.type === 'circle') {
    ctx.beginPath();
    ctx.ellipse(obj.cx, obj.cy, Math.abs(obj.rx), Math.abs(obj.ry), 0, 0, Math.PI * 2);
    if (obj.fillColor && obj.fillColor !== 'transparent') ctx.fill();
    ctx.stroke();
  } else if (obj.type === 'pen') {
    if (!obj.points || obj.points.length < 2) { ctx.restore(); return; }
    ctx.beginPath();
    ctx.moveTo(obj.points[0].x, obj.points[0].y);
    for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
    ctx.stroke();
  } else if (obj.type === 'text') {
    ctx.font = `${obj.fontSize}px ${obj.fontFamily}`;
    ctx.fillStyle = obj.strokeColor;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 3;
    const lines = obj.text.split('\n');
    lines.forEach((line, i) => ctx.fillText(line, obj.x, obj.y + i * obj.fontSize * 1.2));
  }
  ctx.restore();
}

function drawArrow(ctx, x1, y1, x2, y2, lw) {
  const headLen = Math.max(12, lw * 5);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  // arrowhead
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
  ctx.stroke();
}

// ── Canvas coordinate helpers ──────────────────────
function getCanvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

// ── Mouse events ───────────────────────────────────
drawCanvas.addEventListener('mousedown', e => {
  if (state.textEditing) {
    // Don't let browser move focus away from textarea
    e.preventDefault();
  }
  onDown(e);
});
drawCanvas.addEventListener('mousemove', onMove);
drawCanvas.addEventListener('mouseup', onUp);
drawCanvas.addEventListener('mouseleave', onUp);
drawCanvas.addEventListener('mousemove', e => {
  const p = getCanvasPos(e);
  document.getElementById('stat-pos').textContent = Math.round(p.x) + ', ' + Math.round(p.y);
  document.getElementById('stat-pos-wrap').style.display = 'flex';
});

function onDown(e) {
  if (!state.imgW) return;
  if (state.textEditing) return; // handled by capture listener above
  const p = getCanvasPos(e);
  state.drawing = true;

  if (state.tool === 'text') { state.drawing = false; placeTextInput(p.x, p.y); return; }
  if (state.tool === 'eraser') { state.drawing = false; eraseAt(p.x, p.y); return; }
  if (state.tool === 'crop') { startCrop(p.x, p.y); return; }

  if (state.tool === 'blur') {
    state.currentObj = { type: 'blur-sel', x: p.x, y: p.y, w: 0, h: 0, _sx: p.x, _sy: p.y };
    return;
  }

  if (state.tool === 'arrow') {
    state.currentObj = { type: 'arrow', x1: p.x, y1: p.y, x2: p.x, y2: p.y, strokeColor: state.strokeColor, lineWidth: state.lineWidth };
  } else if (state.tool === 'rect') {
    state.currentObj = { type: 'rect', x: p.x, y: p.y, w: 0, h: 0, strokeColor: state.strokeColor, fillColor: state.fillColor, lineWidth: state.lineWidth, _sx: p.x, _sy: p.y };
  } else if (state.tool === 'circle') {
    state.currentObj = { type: 'circle', cx: p.x, cy: p.y, rx: 0, ry: 0, strokeColor: state.strokeColor, fillColor: state.fillColor, lineWidth: state.lineWidth, _sx: p.x, _sy: p.y };
  } else if (state.tool === 'pen') {
    state.currentObj = { type: 'pen', points: [p], strokeColor: state.strokeColor, lineWidth: state.lineWidth };
  }
}

function onMove(e) {
  if (!state.drawing || !state.currentObj) return;
  const p = getCanvasPos(e);
  const obj = state.currentObj;

  if (obj.type === 'blur-sel') {
    obj.x = Math.min(p.x, obj._sx); obj.y = Math.min(p.y, obj._sy);
    obj.w = Math.abs(p.x - obj._sx); obj.h = Math.abs(p.y - obj._sy);
    // show dashed selection preview
    renderDrawings();
    dCtx.save();
    dCtx.setLineDash([5, 4]);
    dCtx.strokeStyle = 'rgba(255,255,255,0.85)';
    dCtx.lineWidth = 1.5;
    dCtx.strokeRect(obj.x, obj.y, obj.w, obj.h);
    dCtx.setLineDash([]);
    dCtx.strokeStyle = 'rgba(0,0,0,0.4)';
    dCtx.lineWidth = 1;
    dCtx.strokeRect(obj.x + 1, obj.y + 1, obj.w - 2, obj.h - 2);
    dCtx.restore();
    return;
  }
  if (obj.type === 'arrow') { obj.x2 = p.x; obj.y2 = p.y; }
  else if (obj.type === 'rect') {
    obj.x = Math.min(p.x, obj._sx); obj.y = Math.min(p.y, obj._sy);
    obj.w = Math.abs(p.x - obj._sx); obj.h = Math.abs(p.y - obj._sy);
  } else if (obj.type === 'circle') {
    obj.rx = (p.x - obj._sx) / 2; obj.ry = (p.y - obj._sy) / 2;
    obj.cx = obj._sx + obj.rx; obj.cy = obj._sy + obj.ry;
  } else if (obj.type === 'pen') { obj.points.push(p); }

  // preview
  renderDrawings();
  renderObject(obj, true);
}

function onUp(e) {
  if (!state.drawing) return;
  state.drawing = false;
  if (!state.currentObj) return;
  const obj = state.currentObj;
  // Blur tool: apply pixelation immediately to baseCanvas
  if (obj.type === 'blur-sel') {
    if (obj.w > 4 && obj.h > 4) {
      applyPixelate(Math.floor(obj.x), Math.floor(obj.y), Math.floor(obj.w), Math.floor(obj.h));
    }
    renderDrawings();
    state.currentObj = null;
    return;
  }

  // Validate minimum size
  let valid = true;
  if (obj.type === 'arrow') { const d = Math.hypot(obj.x2-obj.x1, obj.y2-obj.y1); valid = d > 5; }
  else if (obj.type === 'rect') { valid = obj.w > 3 && obj.h > 3; }
  else if (obj.type === 'circle') { valid = Math.abs(obj.rx) > 3 || Math.abs(obj.ry) > 3; }
  else if (obj.type === 'pen') { valid = obj.points.length > 2; }

  if (valid) {
    // Clean up helper props
    delete obj._sx; delete obj._sy;
    state.objects.push(obj);
    saveUndo();
    renderDrawings();
  } else {
    renderDrawings();
  }
  state.currentObj = null;
}

// ── Eraser ─────────────────────────────────────────
function eraseAt(x, y) {
  // Remove objects that contain point
  const before = state.objects.length;
  state.objects = state.objects.filter(obj => !objectContainsPoint(obj, x, y));
  if (state.objects.length !== before) { saveUndo(); renderDrawings(); }
}

// ── Pixelate (blur/mosaic) ─────────────────────────
function applyPixelate(rx, ry, rw, rh) {
  const blockSize = parseInt(document.getElementById('blur-block-size').value) || 16;
  // clamp to canvas bounds
  rx = Math.max(0, rx); ry = Math.max(0, ry);
  rw = Math.min(rw, state.imgW - rx);
  rh = Math.min(rh, state.imgH - ry);
  if (rw < 2 || rh < 2) return;

  saveUndo(); // save before applying destructive op

  const imageData = bCtx.getImageData(rx, ry, rw, rh);
  const d = imageData.data;

  for (let by = 0; by < rh; by += blockSize) {
    for (let bx = 0; bx < rw; bx += blockSize) {
      // compute average color of block
      let r = 0, g = 0, b = 0, a = 0, count = 0;
      for (let py = by; py < Math.min(by + blockSize, rh); py++) {
        for (let px = bx; px < Math.min(bx + blockSize, rw); px++) {
          const idx = (py * rw + px) * 4;
          r += d[idx]; g += d[idx+1]; b += d[idx+2]; a += d[idx+3];
          count++;
        }
      }
      r = Math.round(r / count); g = Math.round(g / count);
      b = Math.round(b / count); a = Math.round(a / count);
      // fill block with average
      for (let py = by; py < Math.min(by + blockSize, rh); py++) {
        for (let px = bx; px < Math.min(bx + blockSize, rw); px++) {
          const idx = (py * rw + px) * 4;
          d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = a;
        }
      }
    }
  }
  bCtx.putImageData(imageData, rx, ry);
  saveUndo(); // save after
}

function objectContainsPoint(obj, x, y) {
  const tol = 12;
  if (obj.type === 'arrow') {
    const d = distPointLine(x, y, obj.x1, obj.y1, obj.x2, obj.y2);
    return d < tol;
  } else if (obj.type === 'rect') {
    return x >= obj.x - tol && x <= obj.x + obj.w + tol && y >= obj.y - tol && y <= obj.y + obj.h + tol;
  } else if (obj.type === 'circle') {
    const nx = (x - obj.cx) / (obj.rx || 1), ny = (y - obj.cy) / (obj.ry || 1);
    return Math.abs(nx*nx + ny*ny - 1) < 0.3;
  } else if (obj.type === 'pen') {
    return obj.points.some(p => Math.hypot(p.x - x, p.y - y) < tol);
  } else if (obj.type === 'text') {
    return Math.abs(x - obj.x) < 80 && Math.abs(y - obj.y) < 30;
  }
  return false;
}

function distPointLine(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - x1 - t * dx, py - y1 - t * dy);
}

// ── Text tool (hidden textarea + canvas render) ────
const textHidden = document.getElementById('text-input-hidden');
let textCursorBlink = null;
let textCursorVisible = true;

function placeTextInput(x, y) {
  state.textPos = { x, y };
  state.textEditing = true;
  textHidden.value = '';
  textHidden.style.pointerEvents = 'auto';
  // Prevent canvas from stealing focus: use mousedown prevent on drawCanvas
  textHidden.focus({ preventScroll: true });
  // Re-focus on next frame in case something else grabbed it
  requestAnimationFrame(() => textHidden.focus({ preventScroll: true }));
  textCursorVisible = true;
  clearInterval(textCursorBlink);
  textCursorBlink = setInterval(() => {
    textCursorVisible = !textCursorVisible;
    renderDrawings();
    renderTextPreview();
  }, 530);
  renderDrawings();
  renderTextPreview();
}

// Keep focus on textarea while editing
document.addEventListener('mousedown', e => {
  if (state.textEditing && e.target !== textHidden) {
    // allow canvas mousedown capture above to run first, then re-focus
    setTimeout(() => {
      if (state.textEditing) textHidden.focus({ preventScroll: true });
    }, 0);
  }
});

function renderTextPreview() {
  if (!state.textEditing || !state.textPos) return;
  const x = state.textPos.x, y = state.textPos.y;
  const text = textHidden.value;
  const lines = text.split('\n');
  const lh = state.fontSize * 1.25;
  dCtx.save();
  dCtx.font = `${state.fontSize}px ${state.fontFamily}`;
  // measure box width
  let maxW = dCtx.measureText('M').width * 6;
  lines.forEach(l => { const w = dCtx.measureText(l).width; if (w > maxW) maxW = w; });
  const boxH = lines.length * lh;
  // background
  dCtx.fillStyle = 'rgba(0,0,0,0.6)';
  dCtx.beginPath();
  dCtx.roundRect(x - 4, y - state.fontSize - 2, maxW + 8 + 10, boxH + 8, 4);
  dCtx.fill();
  // border
  dCtx.strokeStyle = '#818CF8';
  dCtx.lineWidth = 1.5;
  dCtx.setLineDash([4, 3]);
  dCtx.stroke();
  dCtx.setLineDash([]);
  // text
  dCtx.fillStyle = state.strokeColor;
  dCtx.shadowColor = 'rgba(0,0,0,0.8)';
  dCtx.shadowBlur = 3;
  lines.forEach((line, i) => dCtx.fillText(line, x, y + i * lh));
  // cursor
  if (textCursorVisible) {
    const lastLine = lines[lines.length - 1];
    const cx = x + dCtx.measureText(lastLine).width + 1;
    const cy = y + (lines.length - 1) * lh;
    dCtx.strokeStyle = state.strokeColor;
    dCtx.lineWidth = 2;
    dCtx.beginPath();
    dCtx.moveTo(cx, cy - state.fontSize);
    dCtx.lineTo(cx, cy + 4);
    dCtx.stroke();
  }
  dCtx.restore();
}

textHidden.addEventListener('input', () => {
  renderDrawings();
  renderTextPreview();
});

textHidden.addEventListener('keydown', e => {
  if (e.key === 'Escape') { commitText(false); }
  else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(true); }
});

function commitText(save) {
  if (!state.textEditing) return;
  state.textEditing = false;
  clearInterval(textCursorBlink);
  textHidden.style.pointerEvents = 'none';
  const text = textHidden.value.trim();
  textHidden.value = '';
  if (save && text && state.textPos) {
    state.objects.push({
      type: 'text', text,
      x: state.textPos.x, y: state.textPos.y,
      strokeColor: state.strokeColor,
      fontSize: state.fontSize,
      fontFamily: state.fontFamily
    });
    saveUndo();
  }
  state.textPos = null;
  renderDrawings();
}

// While editing text: canvas mousedown commits and starts new text at new pos
drawCanvas.addEventListener('mousedown', e => {
  if (state.textEditing) {
    e.stopImmediatePropagation();
    commitText(true);
    // start new text input at new click position
    const p = getCanvasPos(e);
    setTimeout(() => placeTextInput(p.x, p.y), 0);
  }
}, true);

// ── Crop ──────────────────────────────────────────
function startCrop(x, y) {
  const overlay = document.getElementById('crop-overlay');
  overlay.classList.add('active');
  state.crop.active = true;
  state.crop.x = x; state.crop.y = y; state.crop.w = 0; state.crop.h = 0;
  state.crop.dragging = true;
  updateCropRegion();
}

function updateCropRegion() {
  const cr = document.getElementById('crop-region');
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = rect.width / drawCanvas.width;
  const scaleY = rect.height / drawCanvas.height;
  const x = state.crop.x * scaleX, y = state.crop.y * scaleY;
  const w = state.crop.w * scaleX, h = state.crop.h * scaleY;
  cr.style.left = Math.min(x, x + w) + 'px';
  cr.style.top = Math.min(y, y + h) + 'px';
  cr.style.width = Math.abs(w) + 'px';
  cr.style.height = Math.abs(h) + 'px';
}

document.getElementById('crop-overlay').addEventListener('mousemove', e => {
  if (!state.crop.dragging) return;
  const p = getCanvasPos(e);
  state.crop.w = p.x - state.crop.x;
  state.crop.h = p.y - state.crop.y;
  updateCropRegion();
});

document.getElementById('crop-overlay').addEventListener('mouseup', e => {
  if (!state.crop.dragging) return;
  state.crop.dragging = false;
  if (Math.abs(state.crop.w) > 10 && Math.abs(state.crop.h) > 10) {
    if (confirm('Обрезать изображение до выделенной области?')) applyCrop();
    else { document.getElementById('crop-overlay').classList.remove('active'); }
  }
});

function applyCrop() {
  let x = state.crop.x, y = state.crop.y, w = state.crop.w, h = state.crop.h;
  if (w < 0) { x += w; w = -w; }
  if (h < 0) { y += h; h = -h; }
  // clamp
  x = Math.max(0, Math.floor(x)); y = Math.max(0, Math.floor(y));
  w = Math.min(state.imgW - x, Math.floor(w));
  h = Math.min(state.imgH - y, Math.floor(h));
  if (w < 4 || h < 4) return;

  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tCtx = tmp.getContext('2d');
  // merge base + drawings
  tCtx.drawImage(baseCanvas, x, y, w, h, 0, 0, w, h);
  tCtx.drawImage(drawCanvas, x, y, w, h, 0, 0, w, h);

  const dataUrl = tmp.toDataURL();
  state.objects = [];
  dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  document.getElementById('crop-overlay').classList.remove('active');
  loadImageFromDataUrl(dataUrl);
}

// ── Rotate / Flip ──────────────────────────────────
function rotateImage(deg) {
  const radians = deg * Math.PI / 180;
  const tmp = document.createElement('canvas');
  const sw = state.imgW, sh = state.imgH;
  tmp.width = Math.abs(deg) === 90 ? sh : sw;
  tmp.height = Math.abs(deg) === 90 ? sw : sh;
  const tCtx = tmp.getContext('2d');
  // merge
  const merged = document.createElement('canvas');
  merged.width = sw; merged.height = sh;
  const mCtx = merged.getContext('2d');
  mCtx.drawImage(baseCanvas, 0, 0);
  mCtx.drawImage(drawCanvas, 0, 0);

  tCtx.translate(tmp.width / 2, tmp.height / 2);
  tCtx.rotate(radians);
  tCtx.drawImage(merged, -sw / 2, -sh / 2);
  state.objects = [];
  loadImageFromDataUrl(tmp.toDataURL());
}

function flipImage(dir) {
  const tmp = document.createElement('canvas');
  tmp.width = state.imgW; tmp.height = state.imgH;
  const tCtx = tmp.getContext('2d');
  const merged = document.createElement('canvas');
  merged.width = state.imgW; merged.height = state.imgH;
  const mCtx = merged.getContext('2d');
  mCtx.drawImage(baseCanvas, 0, 0);
  mCtx.drawImage(drawCanvas, 0, 0);
  if (dir === 'h') { tCtx.scale(-1, 1); tCtx.drawImage(merged, -state.imgW, 0); }
  else { tCtx.scale(1, -1); tCtx.drawImage(merged, 0, -state.imgH); }
  state.objects = [];
  loadImageFromDataUrl(tmp.toDataURL());
}

// ── Zoom ──────────────────────────────────────────
function changeZoom(delta) {
  state.zoom = Math.max(0.2, Math.min(4, state.zoom + delta));
  applyZoom();
}
function resetZoom() {
  const wrap = document.getElementById('canvas-wrap');
  const maxW = wrap.clientWidth - 40;
  const maxH = wrap.clientHeight - 40;
  state.zoom = Math.min(1, maxW / (state.imgW || 1), maxH / (state.imgH || 1));
  applyZoom();
}
function applyZoom() {
  const c = document.getElementById('canvas-container');
  c.style.width = (state.imgW * state.zoom) + 'px';
  c.style.height = (state.imgH * state.zoom) + 'px';
  document.getElementById('zoom-val').textContent = Math.round(state.zoom * 100) + '%';
}

// ── Apply / Cancel ─────────────────────────────────
function applyAndClose() {
  // Flatten base + drawings into one canvas
  const final = document.createElement('canvas');
  final.width = state.imgW; final.height = state.imgH;
  const fCtx = final.getContext('2d');
  fCtx.drawImage(baseCanvas, 0, 0);
  fCtx.drawImage(drawCanvas, 0, 0);
  const dataUrl = final.toDataURL('image/png');
  // Post result to opener
  if (window.opener && window.opener.receiveEditedImage) {
    window.opener.receiveEditedImage(dataUrl);
    window.close();
  } else {
    // Standalone mode: download
    const a = document.createElement('a');
    a.href = dataUrl; a.download = 'edited-screenshot.png'; a.click();
  }
}

function cancelEditor() {
  if (window.opener) window.close();
  else window.history.back();
}

// ── Keyboard shortcuts ─────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  else if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); }
  else if (e.key === 'a') setTool('arrow');
  else if (e.key === 'r') setTool('rect');
  else if (e.key === 'c' && !e.ctrlKey) setTool('crop');
  else if (e.key === 'p') setTool('pen');
  else if (e.key === 't') setTool('text');
  else if (e.key === 'e') setTool('eraser');
  else if (e.key === 'b') setTool('blur');
  else if (e.key === 'Escape') commitText(false);
  else if (e.key === '+' || e.key === '=') changeZoom(0.1);
  else if (e.key === '-') changeZoom(-0.1);
  else if (e.key === '0') resetZoom();
});

// ── Update settings from UI ────────────────────────
document.getElementById('line-width').addEventListener('change', e => state.lineWidth = parseInt(e.target.value));
document.getElementById('font-family').addEventListener('change', e => state.fontFamily = e.target.value);
document.getElementById('font-size').addEventListener('change', e => state.fontSize = parseInt(e.target.value));

// ── Init with demo image if opened standalone ──────
window.addEventListener('load', () => {
  setTool('arrow');
  // Try to receive image from URL param
  const params = new URLSearchParams(location.search);
  if (params.get('demo')) {
    // Create demo placeholder image
    const c = document.createElement('canvas');
    c.width = 900; c.height = 520;
    const ctx = c.getContext('2d');
    // gradient bg
    const g = ctx.createLinearGradient(0,0,900,520);
    g.addColorStop(0, '#0f0f1a');
    g.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = g; ctx.fillRect(0,0,900,520);
    // grid
    ctx.strokeStyle = 'rgba(99,102,241,0.1)'; ctx.lineWidth = 1;
    for (let x = 0; x < 900; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,520); ctx.stroke(); }
    for (let y = 0; y < 520; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(900,y); ctx.stroke(); }
    // text
    ctx.fillStyle = '#6366F1'; ctx.font = 'bold 28px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Демо-изображение PulsarAI', 450, 140);
    ctx.fillStyle = '#818CF8'; ctx.font = '18px Inter, sans-serif';
    ctx.fillText('Нарисуйте стрелки, рамки и текст прямо здесь', 450, 190);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(100, 230, 300, 160); ctx.fillRect(480, 230, 300, 160);
    ctx.fillStyle = '#4A4A62'; ctx.font = '14px Inter, sans-serif';
    ctx.fillText('Блок #1', 250, 320); ctx.fillText('Блок #2', 630, 320);
    ctx.fillStyle = '#F87171'; ctx.font = 'bold 15px Inter, sans-serif';
    ctx.fillText('← Укажи на проблему стрелкой', 450, 440);
    loadImageFromDataUrl(c.toDataURL());
  }
});
</script>
