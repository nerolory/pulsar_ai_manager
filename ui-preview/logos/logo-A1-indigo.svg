<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" fill="none">
  <defs>
    <linearGradient id="gA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Icon: pulse waveform inside rounded square -->
  <rect x="2" y="8" width="32" height="32" rx="8" fill="url(#gA1)"/>
  <rect x="2" y="8" width="32" height="32" rx="8" fill="white" fill-opacity="0.08"/>
  <!-- Pulse line -->
  <polyline points="8,24 12,24 14,16 16,32 18,20 20,28 22,24 28,24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Text -->
  <text x="44" y="29" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F1F1F5" letter-spacing="-0.5">Pulsar</text>
  <text x="111" y="29" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#818CF8" letter-spacing="-0.5">AI</text>
</svg>
