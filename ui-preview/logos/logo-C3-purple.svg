<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="gC3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="wC3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Geometric star burst / neutron star -->
  <circle cx="20" cy="24" r="6" fill="url(#gC3)" fill-opacity="0.3"/>
  <circle cx="20" cy="24" r="3" fill="url(#gC3)"/>
  <!-- Radiating lines (4 directions) -->
  <line x1="20" y1="10" x2="20" y2="16" stroke="url(#gC3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="20" y2="38" stroke="url(#gC3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="12" y2="24" stroke="url(#gC3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="24" x2="34" y2="24" stroke="url(#gC3)" stroke-width="2" stroke-linecap="round"/>
  <!-- Diagonal rays (thinner) -->
  <line x1="10" y1="14" x2="15" y2="19" stroke="url(#gC3)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="25" y1="29" x2="30" y2="34" stroke="url(#gC3)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="30" y1="14" x2="25" y2="19" stroke="url(#gC3)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="10" y1="34" x2="15" y2="29" stroke="url(#gC3)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Text -->
  <text x="44" y="29" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F0EFFE" letter-spacing="-0.5">Pulsar</text>
  <text x="111" y="29" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="url(#gC3)" letter-spacing="-0.5">AI</text>
</svg>
